<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>GamID Intro Preview</title>
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="intro-preview.css?v=__ASSET_VERSION__" />
</head>
<body class="is-experiencing preview-only">
  <main class="prototype-shell"><section class="experience" id="experience">
    <article class="profile" id="profile" aria-hidden="true">
      <div class="profile-glow"></div><header class="profile-topbar"><span class="brand">GAM<span>ID</span></span><span class="preview-badge" id="previewBadge">PREVIEW</span></header>
      <div class="hero-card">
        <div class="avatar-wrap" id="avatarTarget"><img id="previewAvatar" alt="Current GamID Avatar" /></div>
        <p class="eyebrow" id="previewEyebrow">YOUR GAMID</p><h1 id="previewName">Gamer</h1><p class="handle" id="previewHandle">@handle</p>
        <div class="preview-roles"><strong id="previewPrimaryRole"></strong><span id="previewSecondaryRoles"></span></div>
        <p class="preview-education" id="previewEducation"></p><p class="bio" id="previewBio"></p>
        <span class="preview-private" id="previewPrivate">DRAFT · PRIVATE</span>
      </div>
    </article>
    <div class="intro-layer preset-fade" id="introLayer"><div class="media-stage" id="mediaStage">
      <canvas id="introAmbient" class="intro-ambient" aria-hidden="true" width="32" height="18"></canvas><div class="intro-ambient-shade" aria-hidden="true"></div><video id="introVideo" playsinline preload="metadata"></video><div class="media-shade"></div>
      <div class="split-panel split-left"></div><div class="split-panel split-right"></div>
    </div><button class="preview-start" id="previewStart" type="button" hidden><svg class="preview-start-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8 5.5v13l10.5-6.5z"/></svg>Play Intro</button><button class="skip" id="skipButton">Skip intro <span>→</span></button><div class="intro-progress"><i id="progressBar"></i></div>
      <button class="landscape-hint" id="landscapeHint" type="button" hidden aria-label="Watch in landscape fullscreen"><svg viewBox="0 0 48 48" aria-hidden="true" focusable="false"><path class="landscape-arc" d="M33 9a17 17 0 0 1 7 12" /><path class="landscape-arc" d="M40 21l1-4.6M40 21l-4.4-1.6" /><g class="landscape-phone"><rect x="17" y="10" width="14" height="26" rx="3" /><path d="M22 32.5h4" /></g></svg></button>
      <button class="landscape-exit" id="landscapeExit" type="button" hidden>Exit fullscreen</button></div>
  </section></main>
  <script type="module" src="intro-preview.js?v=__ASSET_VERSION__"></script>
</body>
</html>
