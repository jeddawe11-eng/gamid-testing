<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>GamID</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;display:grid;place-items:center;background:radial-gradient(circle at 12% 0,#27134e 0,transparent 28rem),#07060b;color:#f7f5ff;text-align:center;padding:2rem 1.1rem}
    .brand{font-weight:950;letter-spacing:.08em;font-size:1.3rem;margin-bottom:1.4rem}
    .brand span{color:#62e7ff}
    h1{font-size:1.5rem;letter-spacing:-.03em;margin:0 0 .6rem}
    p{color:#aaa4b7;line-height:1.5;max-width:26rem}
    a{color:#62e7ff;font-weight:750;text-decoration:none}
  </style>
</head>
<body>
  <div>
    <div class="brand">GAM<span>ID</span></div>
    <div id="message">
      <h1>This GamID link isn't valid.</h1>
      <p>The page you're looking for doesn't exist.</p>
    </div>
  </div>
  <script>
    (function () {
      var path = location.pathname;
      var match = path.match(/\/@([^/]+)\/?$/);
      if (match) {
        var handle = decodeURIComponent(match[1]);
        var base = path.slice(0, path.length - match[0].length);
        location.replace(base + "/public/index.html?handle=" + encodeURIComponent(handle) + location.search);
      }
    })();
  </script>
</body>
</html>
