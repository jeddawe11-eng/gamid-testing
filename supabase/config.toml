# Minimal Supabase CLI config for GamID TESTING. Only Edge Function JWT policy is pinned here so it lives in the repo
# instead of depending on a deploy-time CLI flag. (All other settings intentionally use CLI defaults; no local stack is used.)
project_id = "gamid-testing"

# Called by the signed-in owner's browser. The gateway verifies the user JWT, and the database re-authenticates it (auth.uid()).
[functions.discord-connect-start]
verify_jwt = true

# Called by Discord's browser redirect: no GamID credentials can be presented. Trust comes exclusively from the one-time,
# database-bound OAuth state validated inside the function.
[functions.discord-connect-callback]
verify_jwt = false

# Steam connection: called by the signed-in owner's browser. Same model as Discord: the gateway verifies the user JWT and the
# database re-authenticates it (auth.uid()).
[functions.steam-connect-start]
verify_jwt = true

# Called by Steam's browser redirect: no GamID credentials can be presented. Trust comes exclusively from the one-time,
# database-bound state (consumed first) plus Steam's own server-side validation of the signed OpenID assertion.
[functions.steam-connect-callback]
verify_jwt = false

# Steam My Games: called by the signed-in owner's browser on an explicit button press. The gateway verifies the user JWT and the
# database re-authenticates it (auth.uid()), resolves that owner's own Steam connection, and throttles before any outbound request.
[functions.steam-games-refresh]
verify_jwt = true

# League prototype: called by the signed-in owner's browser. The gateway verifies the user JWT and the database re-authenticates
# it (auth.uid()) and throttles the lookup before any outbound request is made.
[functions.league-lookup]
verify_jwt = true
